fof-github-sponsors:
  admin:
    account_types:
      user: User
      organization: Organization

    settings:
      api_token_label: API Token
      api_token_help: Create a personal access token at <a>https://github.com/settings/tokens/new</a> with the <code>read:user</code>, <code>user:email</code> and <code>read:org</code> scopes. This token is used to fetch your sponsor information from GitHub.

      account_type_label: Account Type
      account_type_help: Select whether you're tracking sponsors for a personal GitHub user account or an organization account.

      login_label: Login
      login_help: Enter your GitHub username (for user accounts) or organization name (for organizations). This is the account whose sponsors will be synchronized.

      group_label: Monthly Sponsors Group
      group_help: Select which Flarum user group active monthly sponsors should be added to. Users are added when they start sponsoring monthly, and moved to the one-time group (if configured) when their monthly sponsorship ends.

      onetime_group_label: One-Time and Past Sponsors Group (Optional)
      onetime_group_help: Select which Flarum user group one-time sponsors and past monthly sponsors should be added to. If not set, they are not managed.
      onetime_group_none: None

# Audit log entries, rendered by flarum/audit when it is enabled.
flarum-audit:
  lib:
    browser:
      fof_github_sponsors:
        recurring_started: "{username} became a monthly sponsor on GitHub. Groups: {old_groups} → {new_groups}"
        recurring_stopped: "{username}'s monthly GitHub sponsorship stopped. Groups: {old_groups} → {new_groups}"
        onetime_started: "{username} became a one-time sponsor on GitHub. Groups: {old_groups} → {new_groups}"
        sponsorship_ended: "{username} is no longer a GitHub sponsor. Groups: {old_groups} → {new_groups}"
        groups_changed: "GitHub Sponsors sync changed {username}'s groups from {old_groups} to {new_groups}"
        membership_adopted: "GitHub Sponsors sync took over {username}'s membership of {new_groups}"
